<!DOCTYPE html><html><head>    <meta charset="UTF-8"></head><body style="margin:0;padding:0;">    <audio id="bgAudio" autoplay>        <source src="/assets/landing-tune.mp3" type="audio/mpeg">    </audio>    <script>        // This runs in iframe context which may have different autoplay policies        const audio = document.getElementById('bgAudio');        audio.volume = 1;        audio.muted = false;        audio.play().then(() => {            console.log('“ Audio playing in iframe');            // Notify parent frame            window.parent.postMessage({ type: 'audioPlaying' }, '*');        }).catch(e => {            console.log('Iframe audio blocked:', e.message);            window.parent.postMessage({ type: 'audioBlocked' }, '*');        });    </script></body></html>
