<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cloud Transition</title><style>  :root {    --night: #070a1a;    --night-deep: #030512;    --mist: rgba(245, 240, 228, 0.18);    --mist-strong: rgba(245, 240, 228, 0.42);    --accent: #efb89a;    --accent-soft: rgba(239, 184, 154, 0.2);  }  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }  html, body {    width: 100%; height: 100%;    overflow: hidden;    background:      radial-gradient(circle at 50% 38%, rgba(89, 128, 169, 0.32), transparent 26%),      radial-gradient(circle at 18% 24%, rgba(244, 173, 127, 0.2), transparent 18%),      radial-gradient(circle at 80% 24%, rgba(244, 173, 127, 0.15), transparent 18%),      linear-gradient(180deg, #111736 0%, #090c1d 52%, #03050f 100%);    font-family: 'Georgia', serif;  }  body::before {    content: '';    position: fixed;    inset: 0;    pointer-events: none;    background:      radial-gradient(circle at 50% 28%, rgba(255, 255, 255, 0.12), transparent 18%),      radial-gradient(circle at 50% 55%, rgba(255, 255, 255, 0.06), transparent 34%),      linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 18%, transparent 82%, rgba(0, 0, 0, 0.26));    mix-blend-mode: screen;  }  #page-content {    position: fixed; inset: 0;    display: flex; align-items: center; justify-content: center;    color: rgba(255,255,255,0.11);    font-size: clamp(14px, 2vw, 18px);    letter-spacing: .3em;    text-transform: uppercase;    user-select: none;  }  #page-content::before {    content: 'cloud transition';    display: block;    padding: 0.65rem 1.1rem;    border: 1px solid rgba(255, 255, 255, 0.08);    border-radius: 999px;    background: rgba(255, 255, 255, 0.03);    backdrop-filter: blur(16px);    -webkit-backdrop-filter: blur(16px);    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.18);  }  #transition-wrapper {    position: fixed; inset: 0;    z-index: 100;    pointer-events: none;    overflow: hidden;  }  #transition-wrapper::before {    content: '';    position: absolute;    inset: -10%;    background:      radial-gradient(circle at 50% 42%, rgba(255, 244, 228, 0.16), transparent 24%),      radial-gradient(circle at 50% 64%, rgba(18, 24, 54, 0.28), transparent 34%);    opacity: 0.92;    filter: blur(12px);  }  .cloud-panel {    position: absolute;    top: 0; bottom: 0;    width: 62%;    will-change: transform, opacity;    overflow: hidden;    transform: translate3d(0, 0, 0);    filter: drop-shadow(0 22px 36px rgba(1, 5, 16, 0.18));  }  #panel-left  {    left: 0;    transform: translateX(-108%) rotate(-1deg);    transform-origin: left center;  }  #panel-right {    right: 0;    transform: translateX(108%) rotate(1deg);    transform-origin: right center;  }  .cloud-panel::before,  .cloud-panel::after {    content: '';    position: absolute;    inset: 0;    pointer-events: none;  }  .cloud-panel::before {    background: linear-gradient(180deg, rgba(255,255,255,0.28), transparent 18%, transparent 76%, rgba(6, 8, 22, 0.12));    mix-blend-mode: screen;    opacity: .98;  }  .cloud-panel::after {    background:      radial-gradient(circle at 18% 18%, rgba(255,255,255,0.28), transparent 16%),      radial-gradient(circle at 42% 28%, rgba(248,243,235,0.34), transparent 22%),      radial-gradient(circle at 72% 26%, rgba(236,231,224,0.22), transparent 18%),      radial-gradient(circle at 50% 56%, rgba(229,224,216,0.12), transparent 30%),      linear-gradient(90deg, rgba(7, 9, 20, 0.08), transparent 14%, transparent 86%, rgba(7, 9, 20, 0.04));    opacity: 0.58;  }  canvas.cloud-canvas {    position: absolute; inset: 0;    width: 100%; height: 100%;    display: block;    filter: saturate(1.08) contrast(1.0) brightness(1.2);  }  #seam-glow {    position: fixed;    inset: 0;    pointer-events: none;    z-index: 102;    opacity: 0;    background:      linear-gradient(90deg, transparent 0%, rgba(255, 244, 223, 0.08) 48%, rgba(255, 244, 223, 0.12) 50%, rgba(255, 244, 223, 0.08) 52%, transparent 100%),      radial-gradient(circle at 50% 50%, rgba(252, 239, 215, 0.1), transparent 28%);    mix-blend-mode: screen;    filter: blur(16px);  }  #grain {    position: fixed; inset: 0;    z-index: 101;    opacity: 0;    pointer-events: none;    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.12'/%3E%3C/svg%3E");    background-size: 180px 180px;    mix-blend-mode: soft-light;  }  #trigger {    position: fixed;    bottom: clamp(20px, 4vh, 40px);    left: 50%; transform: translateX(-50%);    z-index: 200;    padding: clamp(10px,1.5vh,16px) clamp(24px,4vw,48px);    background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04));    border: 1px solid rgba(255,255,255,0.28);    color: rgba(255,255,255,0.9);    font-family: 'Georgia', serif;    font-size: clamp(11px,1.3vw,14px);    letter-spacing: .25em;    text-transform: uppercase;    cursor: pointer;    border-radius: 999px;    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.26);    backdrop-filter: blur(14px);    -webkit-backdrop-filter: blur(14px);    transition: transform .3s ease, border-color .3s, color .3s, background .3s ease, box-shadow .3s ease;  }  #trigger:hover {    border-color: rgba(255,255,255,.75);    color: #fff;    transform: translateX(-50%) translateY(-2px);    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.34);    background: linear-gradient(180deg, rgba(255,255,255,0.2), rgba(255,255,255,0.06));  }  #trigger:disabled { opacity: .34; cursor: default; transform: translateX(-50%); }  @media (max-width: 700px) {    .cloud-panel { width: 60%; }    #panel-left  { transform: translateX(-112%) rotate(-1deg); }    #panel-right { transform: translateX(112%) rotate(1deg); }  }</style></head><body><div id="page-content">— &nbsp; — &nbsp; —</div><div id="grain"></div><div id="seam-glow"></div><div id="transition-wrapper">  <div class="cloud-panel" id="panel-left">    <canvas class="cloud-canvas" id="canvas-left"></canvas>  </div>  <div class="cloud-panel" id="panel-right">    <canvas class="cloud-canvas" id="canvas-right"></canvas>  </div></div><button id="trigger">Play Transition</button><script>/* ═══════════════════════════════════════════════════════════   DEVICE / PERFORMANCE DETECTION═══════════════════════════════════════════════════════════ */const isLowEnd = (() => {  if (navigator.hardwareConcurrency <= 2) return true;  if (navigator.deviceMemory && navigator.deviceMemory <= 2) return true;  if (/Android.*Chrome\/[0-5]/.test(navigator.userAgent)) return true;  return false;})();const isMobile = window.innerWidth < 600;const transitionTarget = new URLSearchParams(window.location.search).get('target');/* ═══════════════════════════════════════════════════════════   CLOUD CANVAS RENDERER═══════════════════════════════════════════════════════════ */class CloudPanel {  constructor(canvas, side, img) {    this.canvas = canvas;    this.side   = side;    this.img    = img;    this.ctx    = canvas.getContext('2d');    this.dpr    = Math.min(window.devicePixelRatio || 1, isLowEnd ? 1 : 2);    this._resize();    this._paint();  }  _resize() {    const w = this.canvas.parentElement.offsetWidth;    const h = window.innerHeight;    this.canvas.width  = w * this.dpr;    this.canvas.height = h * this.dpr;    this.canvas.style.width  = w + 'px';    this.canvas.style.height = h + 'px';    this.w = w; this.h = h;  }  _paint() {    const { ctx, img, w, h, dpr, side } = this;    ctx.save();    ctx.scale(dpr, dpr);    const iw = img.naturalWidth, ih = img.naturalHeight;    const scale = Math.max(w / iw, h / ih);    const sw = iw * scale, sh = ih * scale;    const sx = (w - sw) / 2, sy = (h - sh) / 2;    if (side === 'left') {      ctx.translate(w, 0);      ctx.scale(-1, 1);    }    ctx.drawImage(img, sx, sy, sw, sh);    if (side === 'left') ctx.setTransform(dpr, 0, 0, dpr, 0, 0);    // Atmosphere tint    const skyTint = ctx.createLinearGradient(0, 0, 0, h);    skyTint.addColorStop(0, 'rgba(107, 142, 173, 0.12)');    skyTint.addColorStop(0.5, 'rgba(255, 236, 216, 0.12)');    skyTint.addColorStop(1, 'rgba(8, 10, 24, 0.14)');    ctx.fillStyle = skyTint;    ctx.fillRect(0, 0, w, h);    const edgeTint = ctx.createLinearGradient(      side === 'left' ? w : 0, 0,      side === 'left' ? 0 : w, 0    );    edgeTint.addColorStop(0, 'rgba(7, 9, 20, 0.18)');    edgeTint.addColorStop(0.5, 'rgba(7, 9, 20, 0.12)');    edgeTint.addColorStop(1, 'rgba(7, 9, 20, 0.08)');    ctx.fillStyle = edgeTint;    ctx.fillRect(0, 0, w, h);    const warmWash = ctx.createLinearGradient(0, 0, 0, h);    warmWash.addColorStop(0, 'rgba(246, 221, 188, 0.22)');    warmWash.addColorStop(0.55, 'rgba(245, 211, 181, 0.14)');    warmWash.addColorStop(1, 'rgba(245, 211, 181, 0.1)');    ctx.fillStyle = warmWash;    ctx.fillRect(0, 0, w, h);    // Soft bloom    if (!isLowEnd) {      ctx.filter = 'blur(18px)';      ctx.globalAlpha = 0.22;      ctx.drawImage(img, sx, sy, sw, sh);      ctx.globalAlpha = 1;      ctx.filter = 'none';    }    const cloudShadows = [      [w * 0.44, h * 0.24, w * 0.36, h * 0.16, 'rgba(249, 246, 240, 0.5)'],      [w * 0.28, h * 0.38, w * 0.28, h * 0.14, 'rgba(244, 240, 232, 0.42)'],      [w * 0.62, h * 0.34, w * 0.32, h * 0.15, 'rgba(247, 243, 236, 0.46)'],      [w * 0.5,  h * 0.52, w * 0.4,  h * 0.14, 'rgba(236, 231, 222, 0.34)'],      [w * 0.18, h * 0.58, w * 0.24, h * 0.12, 'rgba(226, 226, 232, 0.26)'],      [w * 0.82, h * 0.56, w * 0.26, h * 0.12, 'rgba(226, 226, 232, 0.26)']    ];    ctx.globalCompositeOperation = 'screen';    cloudShadows.forEach(([cx, cy, rx, ry, color]) => {      const puff = ctx.createRadialGradient(cx, cy, 8, cx, cy, Math.max(rx, ry));      puff.addColorStop(0, color);      puff.addColorStop(0.55, color.replace(/0\.[0-9]+\)$/, '0.16)'));      puff.addColorStop(1, 'rgba(255, 255, 255, 0)');      ctx.fillStyle = puff;      ctx.filter = 'blur(12px)';      ctx.beginPath();      ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);      ctx.fill();    });    ctx.filter = 'none';    ctx.globalCompositeOperation = 'source-over';    // Edge feather    const edgeX = side === 'left' ? w : 0;    const edgeDir = side === 'left' ? w - w * 0.4 : w * 0.4;    const edgeGrad = ctx.createLinearGradient(edgeX, 0, edgeDir, 0);    edgeGrad.addColorStop(0, 'rgba(7, 9, 20, 0)');    edgeGrad.addColorStop(0.5, 'rgba(7, 9, 20, 0.04)');    edgeGrad.addColorStop(0.8, 'rgba(7, 9, 20, 0.14)');    edgeGrad.addColorStop(1, 'rgba(7, 9, 20, 0.34)');    ctx.fillStyle = edgeGrad;    ctx.fillRect(0, 0, w, h);    const topGrad = ctx.createLinearGradient(0, 0, 0, h);    topGrad.addColorStop(0, 'rgba(7, 9, 20, 0.12)');    topGrad.addColorStop(0.5, 'rgba(7, 9, 20, 0.05)');    topGrad.addColorStop(1, 'rgba(7, 9, 20, 0.02)');    ctx.fillStyle = topGrad;    ctx.fillRect(0, 0, w, h);    const botGrad = ctx.createLinearGradient(0, 0, 0, h);    botGrad.addColorStop(0, 'rgba(3, 5, 14, 0.06)');    botGrad.addColorStop(0.55, 'rgba(3, 5, 14, 0.12)');    botGrad.addColorStop(1, 'rgba(3, 5, 14, 0.28)');    ctx.fillStyle = botGrad;    ctx.fillRect(0, 0, w, h);    // Micro texture    if (!isLowEnd) {      ctx.globalAlpha = 0.04;      ctx.globalCompositeOperation = 'overlay';      const count = isMobile ? 5000 : 15000;      for (let i = 0; i < count; i++) {        const gx = Math.random() * w;        const gy = Math.random() * h;        const brightness = Math.random() > 0.5 ? 255 : 0;        ctx.fillStyle = `rgba(${brightness},${brightness},${brightness},${Math.random() * 0.5})`;        ctx.fillRect(gx, gy, 1, 1);      }      ctx.globalAlpha = 1;      ctx.globalCompositeOperation = 'source-over';    }    ctx.restore();  }}/* ═══════════════════════════════════════════════════════════   ANIMATION ENGINE═══════════════════════════════════════════════════════════ */function easeInOutQuart(t) {  return t < 0.5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2;}function easeOutExpo(t) {  return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);}function easeInExpo(t) {  return t === 0 ? 0 : Math.pow(2, 10 * t - 10);}function lerp(a, b, t) { return a + (b - a) * t; }function runLowEndTransition(panelLeft, panelRight, grain, seam, done) {  const dur = '1.1s';  const ease = 'cubic-bezier(0.76,0,0.24,1)';  [panelLeft, panelRight].forEach(p => {    p.style.transition = `transform ${dur} ${ease}, filter ${dur} ${ease}`;  });  panelLeft.style.transform  = 'translateX(0) rotate(0deg)';  panelLeft.style.filter = 'drop-shadow(0 35px 60px rgba(1, 5, 16, 0.34))';  grain.style.opacity = '0.6';  grain.style.transition = 'opacity .4s';  setTimeout(() => { panelRight.style.transform = 'translateX(0) rotate(0deg)'; }, 220);  setTimeout(() => {    const outDur = '1s';    [panelLeft, panelRight].forEach(p => {      p.style.transition = `transform ${outDur} ${ease}, filter ${outDur} ${ease}`;    });    panelLeft.style.transform  = 'translateX(-108%) rotate(-1deg)';    panelRight.style.transform = 'translateX(108%) rotate(1deg)';    grain.style.opacity = '0';    setTimeout(done, 1100);  }, 1600);}function runHighEndTransition(panelLeft, panelRight, grain, seam, done) {  const PHASE1_DURATION = 1200;  const DELAY_RIGHT     = 200;  const HOLD_DURATION   = 700;  const PHASE2_DURATION = 1100;  let startTime = null;  let phase = 'in';  let phaseStart = null;  function tick(ts) {    if (!startTime) startTime = ts;    if (phase === 'in') {      if (!phaseStart) phaseStart = ts;      const t1 = Math.min((ts - phaseStart) / PHASE1_DURATION, 1);      const tRight = Math.min(Math.max((ts - phaseStart - DELAY_RIGHT) / PHASE1_DURATION, 0), 1);      const leftX  = lerp(-100, 0, easeOutExpo(t1));      const rightX = lerp(100,  0, easeOutExpo(tRight));      const leftRot  = lerp(-1.8, 0, easeInOutQuart(t1));      const rightRot = lerp( 1.8, 0, easeInOutQuart(tRight));      panelLeft.style.transform  = `translateX(${leftX}%) rotate(${leftRot}deg)`;      panelRight.style.transform = `translateX(${rightX}%) rotate(${rightRot}deg)`;      panelLeft.style.filter  = `drop-shadow(0 35px 60px rgba(1, 5, 16, ${lerp(0.38, 0.24, t1)}))`;      panelRight.style.filter = `drop-shadow(0 35px 60px rgba(1, 5, 16, ${lerp(0.38, 0.24, tRight)}))`;      grain.style.opacity = String(lerp(0, 0.7, easeInOutQuart(t1)));      seam.style.opacity  = String(lerp(0, 0.55, easeInOutQuart(t1)));      if (t1 >= 1 && tRight >= 1) { phase = 'hold'; phaseStart = ts; }    } else if (phase === 'hold') {      if (ts - phaseStart >= HOLD_DURATION) { phase = 'out'; phaseStart = ts; }    } else if (phase === 'out') {      const t = Math.min((ts - phaseStart) / PHASE2_DURATION, 1);      const leftX  = lerp(0, -105, easeInOutQuart(t));      const rightX = lerp(0,  105, easeInOutQuart(t));      const scaleL = lerp(1, 0.94, easeInExpo(t));      const scaleR = lerp(1, 0.94, easeInExpo(t));      const leftRot  = lerp(0, -1.2, easeInOutQuart(t));      const rightRot = lerp(0,  1.2, easeInOutQuart(t));      panelLeft.style.transform  = `translateX(${leftX}%) rotate(${leftRot}deg) scale(${scaleL})`;      panelRight.style.transform = `translateX(${rightX}%) rotate(${rightRot}deg) scale(${scaleR})`;      grain.style.opacity = String(lerp(0.7, 0, easeInOutQuart(t)));      seam.style.opacity  = String(lerp(0.55, 0, easeInOutQuart(t)));      if (t >= 1) { done(); return; }    }    requestAnimationFrame(tick);  }  requestAnimationFrame(tick);}/* ═══════════════════════════════════════════════════════════   BOOTSTRAP═══════════════════════════════════════════════════════════ */const img = new Image();img.onload = () => init(img);img.onerror = () => {  // Procedural cloud fallback if image missing  const fc = document.createElement('canvas');  fc.width = 1200; fc.height = 750;  const fctx = fc.getContext('2d');  const sky = fctx.createLinearGradient(0, 0, 0, 750);  sky.addColorStop(0, '#1a3a6b');  sky.addColorStop(0.4, '#3a7abf');  sky.addColorStop(0.7, '#89b9e0');  sky.addColorStop(1, '#c5d8ea');  fctx.fillStyle = sky; fctx.fillRect(0, 0, 1200, 750);  function puff(cx, cy, rx, ry, a) {    const g = fctx.createRadialGradient(cx, cy - ry * 0.2, ry * 0.1, cx, cy, Math.max(rx, ry));    g.addColorStop(0, `rgba(255,252,245,${a})`);    g.addColorStop(0.5, `rgba(235,228,210,${a * 0.8})`);    g.addColorStop(1, `rgba(200,220,240,0)`);    fctx.fillStyle = g;    fctx.beginPath(); fctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); fctx.fill();  }  [[600,400,200,140,0.97],[450,450,150,110,0.92],[750,430,160,120,0.9],   [580,290,110,80,0.88],[670,300,100,75,0.85],[400,480,130,95,0.82],   [820,460,140,100,0.8],[540,500,90,65,0.78],[700,360,80,60,0.75],   [280,510,100,75,0.72],[950,500,110,80,0.7]  ].forEach(([cx,cy,rx,ry,a]) => puff(cx,cy,rx,ry,a));  const fi = new Image();  fi.onload = () => init(fi);  fi.src = fc.toDataURL();};img.src = 'cloud-asset.png';function init(cloudImg) {  const canvasL = document.getElementById('canvas-left');  const canvasR = document.getElementById('canvas-right');  const panelL  = document.getElementById('panel-left');  const panelR  = document.getElementById('panel-right');  const grain   = document.getElementById('grain');  const seam    = document.getElementById('seam-glow');  const btn     = document.getElementById('trigger');  function setup() {    new CloudPanel(canvasL, 'left',  cloudImg);    new CloudPanel(canvasR, 'right', cloudImg);  }  setup();  let resizeTO;  window.addEventListener('resize', () => {    clearTimeout(resizeTO);    resizeTO = setTimeout(setup, 200);  });  btn.addEventListener('click', () => {    btn.disabled = true;    grain.style.transition = 'opacity .5s';    const done = () => {      if (transitionTarget) {        window.location.href = transitionTarget;        return;      }      btn.disabled = false;      panelL.style.transform = 'translateX(-108%) rotate(-1deg)';      panelR.style.transform = 'translateX(108%) rotate(1deg)';      grain.style.opacity = '0';      seam.style.opacity  = '0';    };    if (isLowEnd || isMobile) {      runLowEndTransition(panelL, panelR, grain, seam, done);    } else {      runHighEndTransition(panelL, panelR, grain, seam, done);    }  });}window.addEventListener('load', () => setTimeout(() => {  document.getElementById('trigger').click();}, 600));</script></body></html>
