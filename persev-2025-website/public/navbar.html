<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toormix-style Navbar Recreation</title>
  <style>
    :root {
      --yellow: #fff135;
      --black: #000;
      --white: #fff;
      --glass: rgba(205, 205, 205, 0.8);
      --glass-hover: #7a7a7a;
      --shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      --radius: 8px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "GT America Mono", "SFMono-Regular", Consolas, monospace;
      background: #fff;
    }

    /* Demo page background only */
    .demo-stage {
      min-height: 100vh;
      background:
        radial-gradient(circle at center, rgba(0,0,0,0.03), transparent 45%),
        #fff;
    }

    /* Floating nav wrapper */
    .toormix-nav {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 100;
      width: calc(100% - 20px);
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .toormix-nav__inner {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      pointer-events: auto;
    }

    /* Logo block */
    .toormix-nav__logo {
      width: 59px;
      height: 40px;
      border-radius: 8px;
      background: var(--yellow);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      flex-shrink: 0;
    }

    .toormix-nav__logo img {
      width: 31px;
      height: auto;
      display: block;
    }

    /* Main nav pill */
    .toormix-nav__menu {
      display: flex;
      align-items: center;
      padding: 0;
      border-radius: 8px;
      background: var(--glass);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .toormix-nav__link {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 12px 13px;
      color: var(--black);
      text-decoration: none;
      text-transform: uppercase;
      font-size: 16px;
      line-height: 1;
      border-radius: 8px;
      transition: background-color 0.15s ease, color 0.15s ease;
      white-space: nowrap;
    }

    .toormix-nav__link:hover {
      background: rgba(0, 0, 0, 0.08);
    }

    .toormix-nav__link.is-active {
      background: var(--black);
      color: var(--white);
    }

    /* Language dropdown */
    .toormix-lang {
      position: relative;
      width: 53px;
      height: 40px;
      flex-shrink: 0;
    }

    .toormix-lang__current,
    .toormix-lang__option {
      width: 53px;
      height: 40px;
      border: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      font: inherit;
      font-size: 16px;
      line-height: 1;
      color: var(--black);
      background: var(--glass);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      box-shadow: var(--shadow);
      border-radius: 40px;
      transition: background-color 0.15s ease, color 0.15s ease, transform 0.2s ease, opacity 0.2s ease;
    }

    .toormix-lang__current:hover {
      background: var(--glass-hover);
      color: var(--white);
    }

    .toormix-lang__list {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      pointer-events: none;
    }

    .toormix-lang__item {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      opacity: 0;
      transform: translateY(0);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .toormix-lang.is-open .toormix-lang__current {
      background: var(--glass-hover);
      color: var(--white);
    }

    .toormix-lang.is-open .toormix-lang__item:nth-child(1) {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(calc(-100% - 8px));
    }

    .toormix-lang.is-open .toormix-lang__item:nth-child(2) {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(calc(-200% - 16px));
    }

    /* Mobile: keep only logo for a cleaner approximation */
    @media (max-width: 1190px) {
      .toormix-nav__menu,
      .toormix-lang {
        display: none;
      }

      .toormix-nav__logo {
        width: 75px;
        height: 56px;
      }

      .toormix-nav__logo img {
        width: 31px;
      }
    }
  </style>
</head>
<body>
  <div class="demo-stage"></div>

  <nav class="toormix-nav" aria-label="Primary">
    <div class="toormix-nav__inner">
      <a class="toormix-nav__logo" href="/en/" aria-label="Toormix home">
        <img
          src="https://content.toormix.com/wp-content/uploads/2025/10/logo-toormix.svg"
          alt="Toormix"
        />
      </a>

      <div class="toormix-nav__menu">
        <a class="toormix-nav__link is-active" href="/en/projects/">Projects</a>
        <a class="toormix-nav__link" href="/en/us-brand-design-digital/">About us</a>
        <a class="toormix-nav__link" href="/en/methodology/">Methodology</a>
        <a class="toormix-nav__link" href="/en/new-project/">Contact</a>
      </div>

      <div class="toormix-lang" id="langMenu">
        <button class="toormix-lang__current" type="button" aria-expanded="false" aria-label="Select language">
          EN
        </button>

        <div class="toormix-lang__list">
          <div class="toormix-lang__item">
            <a class="toormix-lang__option" href="/es/proyectos">ES</a>
          </div>
          <div class="toormix-lang__item">
            <a class="toormix-lang__option" href="/ca/projectes">CA</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <script>
    const langMenu = document.getElementById("langMenu");
    const currentBtn = langMenu.querySelector(".toormix-lang__current");

    currentBtn.addEventListener("click", () => {
      const isOpen = langMenu.classList.toggle("is-open");
      currentBtn.setAttribute("aria-expanded", isOpen ? "true" : "false");
    });

    document.addEventListener("click", (e) => {
      if (!langMenu.contains(e.target)) {
        langMenu.classList.remove("is-open");
        currentBtn.setAttribute("aria-expanded", "false");
      }
    });
  </script>
</body>
</html>
