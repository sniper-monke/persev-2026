<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interschool Events — Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    background: radial-gradient(ellipse at top, #08101f 0%, #030712 45%, #000814 100%);
    color:#fff;
    font-family:'Rajdhani', sans-serif;
    overflow-x:hidden;
    letter-spacing:0.05em;
  }
  body {
    /* Total scroll length drives the virtual progress (0 -> 1). After this,
       normal scroll takes over for the rankings section. */
    min-height: 600vh; /* keep cinematic range while allowing extra content to extend naturally */
  }

  /* ======================================================================
     FIXED STAGE — all scene 1-4 content lives here. It stays pinned while
     the user scrolls; all movement is computed from scroll progress.
     ====================================================================== */
  #stage {
    position: fixed;
    inset: 0;
    width:100vw; height:100vh;
    overflow:hidden;
    background: radial-gradient(ellipse at 50% 45%, #101a33 0%, #07101f 42%, #02050d 100%);
    z-index: 1;
    will-change: opacity, transform;
    transition: opacity 0.5s ease;
  }
  #stage.done { opacity: 1; pointer-events: none; }

  /* Particle canvas (deepest layer) */
  #particles {
    position:absolute; inset:0;
    width:100%; height:100%;
    z-index: 1;
  }

  /* Parallax layers — each scene container moves independently based on progress */
  .scene {
    position:absolute;
    inset:0;
    will-change: transform, opacity;
    pointer-events:none;
  }

  /* ---------- Hanging butterflies (top 3) ---------- */
  .hang-line {
    position:absolute;
    top: -100vh;
    width: 1px;
    height: 200vh;
    background: linear-gradient(to bottom,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,0.08) 20%,
      rgba(255,255,255,0.35) 70%,
      rgba(255,255,255,0.55) 100%);
    transform-origin: top center;
    will-change: transform;
  }

  .butterfly-hero {
    position:absolute;
    left:50%;
    top: 50%;
    width: 140px;
    height: 140px;
    transform: translate(-50%, -50%);
    will-change: transform, opacity, filter;
    filter: drop-shadow(0 0 30px rgba(255,255,255,0.45))
            drop-shadow(0 0 60px rgba(180,200,255,0.25));
  }
  .butterfly-hero svg { width:100%; height:100%; overflow:visible; }
  .butterfly-hero .wing { transform-origin: center; animation: flap 2.6s ease-in-out infinite; }
  .butterfly-hero .wing.left  { animation-delay: 0s; }
  .butterfly-hero .wing.right { animation-delay: 0s; }
  @keyframes flap {
    0%, 100% { transform: scaleX(1); }
    50%      { transform: scaleX(0.72); }
  }

  /* Side decorative butterflies (same style, smaller, hanging) */
  .butterfly-side {
    position:absolute;
    width: 54px; height: 54px;
    transform: translate(-50%, -50%);
    will-change: transform, opacity;
    filter: drop-shadow(0 0 14px rgba(255,255,255,0.35));
    opacity: 0.85;
  }
  .butterfly-side svg { width:100%; height:100%; overflow:visible; }
  .butterfly-side .wing { transform-origin: center; animation: flap 3s ease-in-out infinite; }

  /* ---------- Text blocks ---------- */
  .slide-text {
    position:absolute;
    will-change: transform, opacity;
    opacity:0;
    font-family:'Rajdhani', sans-serif;
    font-weight:300;
    letter-spacing:0.35em;
    text-transform:uppercase;
  }
  .slide-text .rank-label {
    font-size: 13px;
    color: rgba(255,255,255,0.55);
    margin-bottom: 18px;
    letter-spacing: 0.5em;
  }
  .slide-text .name {
    font-size: 44px;
    font-weight: 400;
    color: #fff;
    margin-bottom: 14px;
    letter-spacing: 0.18em;
    white-space: nowrap;
  }
  .slide-text .points {
    font-family: 'Orbitron', monospace;
    font-size: 22px;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.25em;
  }
  .slide-text .divider {
    width: 60px; height: 1px;
    background: rgba(255,255,255,0.3);
    margin: 20px 0;
  }

  /* Positioning of each place's text */
  #text-1 { left: 8%;  top: 42%; }
  #text-2 { left: 50%; top: 62%; transform: translateX(-50%); text-align:center; }
  #text-3 { right: 8%; top: 42%; text-align:right; }

  /* ---------- Decorative orbital rings (scene 1) ---------- */
  .rings {
    position:absolute;
    left: 50%; top: 75%;
    transform: translate(-50%, -50%);
    width: 1100px; height: 400px;
    pointer-events:none;
    will-change: transform, opacity;
    opacity: 0;
  }
  .rings .ring {
    position:absolute;
    left:50%; top:50%;
    transform: translate(-50%,-50%);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 50%;
  }
  .rings .ring.r1 { width: 300px; height: 70px; }
  .rings .ring.r2 { width: 520px; height: 130px; border-color: rgba(255,255,255,0.10); }
  .rings .ring.r3 { width: 780px; height: 210px; border-color: rgba(255,255,255,0.07); }
  .rings .ring.r4 { width: 1080px; height: 310px; border-color: rgba(255,255,255,0.04); }

  /* ---------- Nebula (scene 3) ---------- */
  .nebula {
    position:absolute;
    will-change: transform, opacity;
    opacity: 0;
    filter: blur(60px);
    mix-blend-mode: screen;
    pointer-events:none;
  }
  .nebula.n1 {
    left: 55%; top: 45%;
    width: 600px; height: 420px;
    background: radial-gradient(ellipse, rgba(120,130,180,0.45) 0%, rgba(60,70,120,0.15) 45%, transparent 75%);
  }
  .nebula.n2 {
    left: 60%; top: 55%;
    width: 400px; height: 300px;
    background: radial-gradient(ellipse, rgba(180,160,200,0.35) 0%, transparent 70%);
  }

  /* ---------- Blank slide (scene 4) decorations ---------- 
  .blank-deco {
    position:absolute;
    inset:0;
    will-change: opacity;
    opacity:0;
    pointer-events:none;
  }
  .blank-deco .crosshair {
    position:absolute;
    left:50%; top:50%;
    transform: translate(-50%,-50%);
    width: 70vw; max-width: 800px; height: 1px;
    background: linear-gradient(to right, transparent, rgba(255,255,255,0.25), transparent);
  }
  .blank-deco .crosshair.v {
    width: 1px; height: 70vh; max-height: 600px;
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.25), transparent);
  }
  .blank-deco .ring-dec {
    position:absolute;
    left:50%; top:50%;
    transform: translate(-50%,-50%);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 50%;
  }
  .blank-deco .ring-dec.a { width: 300px; height: 300px; }
  .blank-deco .ring-dec.b { width: 500px; height: 500px; border-color: rgba(255,255,255,0.06); }
  .blank-deco .ring-dec.c { width: 700px; height: 700px; border-color: rgba(255,255,255,0.03); }
  .blank-deco .corner {
    position:absolute;
    width: 40px; height: 40px;
    border: 1px solid rgba(255,255,255,0.3);
  }
  .blank-deco .corner.tl { top: 40px; left: 40px; border-right:none; border-bottom:none; }
  .blank-deco .corner.tr { top: 40px; right: 40px; border-left:none; border-bottom:none; }
  .blank-deco .corner.bl { bottom: 40px; left: 40px; border-right:none; border-top:none; }
  .blank-deco .corner.br { bottom: 40px; right: 40px; border-left:none; border-top:none; }
  .blank-deco .blank-title {
    position:absolute;
    left:50%; top:50%;
    transform: translate(-50%,-50%);
    font-family:'Rajdhani', sans-serif;
    font-weight:300;
    font-size: 12px;
    letter-spacing: 0.8em;
    color: rgba(255,255,255,0.55);
    text-transform:uppercase;
    white-space:nowrap;
  }
    */
  /* ---------- Chrome ---------- */
  .hamburger {
    position: fixed;
    top: 34px; left: 34px;
    z-index: 60;
    display:flex; flex-direction:column; gap:5px;
    cursor:pointer;
  }
  .hamburger span {
    display:block;
    width: 26px; height: 1.5px;
    background: #fff;
  }
  .brand {
    position: fixed;
    top: 34px; right: 80px;
    z-index: 60;
    font-family:'Orbitron', monospace;
    font-size: 12px;
    letter-spacing: 0.4em;
    color: rgba(255,255,255,0.85);
  }
  .scroll-indicator {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%);
    z-index: 60;
    font-size: 10px;
    letter-spacing: 0.5em;
    color: rgba(255,255,255,0.6);
    text-transform:uppercase;
    will-change: opacity;
  }
  .scroll-indicator .chev {
    display:block;
    width: 12px; height: 12px;
    border-right: 1.5px solid rgba(255,255,255,0.7);
    border-bottom: 1.5px solid rgba(255,255,255,0.7);
    transform: rotate(45deg);
    margin: 10px auto 0;
    animation: bob 1.8s ease-in-out infinite;
  }
  @keyframes bob {
    0%,100% { transform: rotate(45deg) translate(0,0); opacity: .7; }
    50%     { transform: rotate(45deg) translate(4px,4px); opacity: 1; }
  }

  /* ======================================================================
     RANKINGS SECTION — appears AFTER virtual scroll finishes.
     It exists as normal flow starting at 600vh (the end of the stage).
     ====================================================================== */
  #rankings {
    position: relative;
    margin-top: 550vh;   /* sit near the end of virtual scroll */
    min-height: 100vh;
    background: transparent;
    z-index: 5;
    padding: 120px 40px 120px;
    overflow: hidden;
  }
  #rankings::before {
    content: none;
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 12% 22%, rgba(255,255,255,0.7) 0 1px, transparent 1.2px),
      radial-gradient(circle at 28% 68%, rgba(255,255,255,0.6) 0 1px, transparent 1.2px),
      radial-gradient(circle at 46% 34%, rgba(255,255,255,0.65) 0 1px, transparent 1.2px),
      radial-gradient(circle at 61% 78%, rgba(255,255,255,0.55) 0 1px, transparent 1.2px),
      radial-gradient(circle at 74% 18%, rgba(255,255,255,0.65) 0 1px, transparent 1.2px),
      radial-gradient(circle at 88% 56%, rgba(255,255,255,0.58) 0 1px, transparent 1.2px);
    opacity: 0;
    mix-blend-mode: screen;
    animation: starsPulse 6s ease-in-out infinite;
    pointer-events:none;
  }

  @keyframes starsPulse {
    0%, 100% { opacity: 0.16; }
    50% { opacity: 0.28; }
  }
  #rankings .rk-head {
    text-align:center;
    margin-bottom: 40px;
  }
  #rankings .rk-head h2 {
    font-family:'Orbitron', monospace;
    font-size: 28px;
    letter-spacing: 0.5em;
    font-weight: 400;
    color: #fff;
    margin-bottom: 10px;
  }
  #rankings .rk-head p {
    font-size: 12px;
    letter-spacing: 0.4em;
    color: rgba(255,255,255,0.45);
    text-transform:uppercase;
  }
  #rankings .rk-field {
    position: relative;
    width: 100%;
    max-width: 100%;
    aspect-ratio: 1;
    min-height: 600px;
    margin: 80px auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .rk-circle-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 800px;
    max-height: 800px;
    border-radius: 50%;
  }
  .rk-butterfly {
    position: absolute;
    width: 66px;
    height: 66px;
    cursor: pointer;
    transition: filter 0.3s, transform 0.3s, opacity 0.3s;
    will-change: transform, filter, opacity;
    animation: rkfloat 6s ease-in-out infinite;
  }
  .rk-butterfly.dimmed {
    filter: brightness(0.3) opacity(0.4);
  }
  .rk-butterfly.highlighted {
    filter: drop-shadow(0 0 20px rgba(255,255,255,1));
    z-index: 10;
  }
  .rk-butterfly svg { width:100%; height:100%; overflow:visible; }
  .rk-butterfly .wing { transform-origin: center; animation: flap 2.8s ease-in-out infinite; }
  .rk-butterfly:hover {
    filter: drop-shadow(0 0 16px rgba(255,255,255,0.8));
  }
  .rk-butterfly.dimmed:hover {
    filter: brightness(0.3) opacity(0.4) drop-shadow(0 0 8px rgba(255,255,255,0.3));
  }
  .rk-search-bar {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .rk-search-bar input {
    width: 180px;
    padding: 10px 16px;
    background: rgba(10,10,18,0.15);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    letter-spacing: 0.1em;
    border-radius: 3px;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
    backdrop-filter: blur(8px);
  }
  .rk-search-bar input:focus {
    border-color: rgba(255,255,255,0.6);
    box-shadow: 0 0 12px rgba(255,255,255,0.15);
  }
  .rk-search-bar input::placeholder {
    color: rgba(255,255,255,0.35);
  }
  .rk-search-hint {
    font-size: 11px;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.15);
    text-transform: uppercase;
  }
  @keyframes rkfloat {
    0%,100% { translate: 0 0; }
    50%     { translate: 0 -8px; }
  }

  /* Tooltip */
  .rk-tooltip {
    position: fixed;
    z-index: 200;
    pointer-events:none;
    background: rgba(10,10,18,0.95);
    border: 1px solid rgba(255,255,255,0.25);
    padding: 14px 20px;
    font-family:'Orbitron', monospace;
    font-size: 12px;
    color:#fff;
    letter-spacing: 0.2em;
    backdrop-filter: blur(10px);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .2s, transform .2s;
  }
  .rk-tooltip.visible { opacity:1; transform: translateY(0); }
  .rk-tooltip .tt-name { color:#fff; font-size: 14px; margin-bottom: 4px; }
  .rk-tooltip .tt-rank { color: rgba(255,255,255,0.6); font-size: 10px; margin-bottom: 8px; }
  .rk-tooltip .tt-points { color:#9ac4ff; font-size: 12px; }

  /* Intro veil */
  #pageVeil {
    position: fixed;
    inset: 0;
    z-index: 500;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% 40%, rgba(248,180,45,0.08) 0%, rgba(248,180,45,0.02) 20%, transparent 44%),
      radial-gradient(circle at 50% 50%, rgba(8,16,31,0.08) 0%, rgba(3,7,18,0.4) 58%, rgba(0,8,20,0.92) 100%);
    backdrop-filter: blur(10px) saturate(1.08);
    -webkit-backdrop-filter: blur(10px) saturate(1.08);
    opacity: 1;
    transform: scale(1.015);
    transition: opacity 1.05s cubic-bezier(0.22, 1, 0.36, 1), transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  #pageVeil.hidden {
    opacity: 0;
    transform: scale(1);
  }

  @media (max-width: 700px) {
    body {
      min-height: 460vh;
    }

    #rankings {
      margin-top: 325vh;
      padding: 72px 16px 88px;
    }

    #rankings .rk-head {
      margin-bottom: 22px;
    }

    #rankings .rk-head h2 {
      font-size: 22px;
      letter-spacing: 0.34em;
    }

    #rankings .rk-head p {
      font-size: 10px;
      letter-spacing: 0.28em;
    }

    .slide-text {
      left: 50%;
      width: min(88vw, 320px);
      padding: 15px 16px 16px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(9, 15, 34, 0.72), rgba(3, 7, 18, 0.88));
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      text-align: center;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.24);
    }

    .slide-text .rank-label {
      font-size: 10px;
      letter-spacing: 0.34em;
      margin-bottom: 10px;
    }

    .slide-text .name {
      font-size: clamp(24px, 8vw, 31px);
      line-height: 0.95;
      white-space: normal;
      margin-bottom: 10px;
    }

    .slide-text .divider {
      width: 44px;
      margin: 14px auto;
    }

    .slide-text .points {
      font-size: 16px;
      letter-spacing: 0.18em;
    }

    #text-1 { top: 13%; transform: translateX(-50%); }
    #text-2 { top: 41%; transform: translateX(-50%); }
    #text-3 { top: 69%; transform: translateX(-50%); }

    .butterfly-hero {
      width: 92px;
      height: 92px;
    }

    #bf-1, #bf-2, #bf-3 {
      left: 50%;
    }

    #line-1, #line-2, #line-3 {
      left: 50% !important;
    }

    #bf-s1-a, #bf-s1-b,
    #line-s1-a, #line-s1-b,
    .rings,
    .nebula {
      display: none;
    }

    .scroll-indicator {
      bottom: 18px;
      font-size: 9px;
      letter-spacing: 0.34em;
    }

    .scroll-indicator .chev {
      margin-top: 8px;
    }

    #rankings .rk-field {
      aspect-ratio: auto;
      min-height: 760px;
      margin: 52px auto 0;
    }

    .rk-circle-container {
      max-width: 100%;
      min-height: 680px;
      overflow: visible;
    }

    .rk-search-bar {
      top: 18px;
      width: min(86vw, 300px);
    }

    .rk-search-bar input {
      width: 100%;
      padding: 12px 16px;
      font-size: 12px;
    }

    .rk-search-hint {
      font-size: 9px;
      letter-spacing: 0.24em;
    }

    .rk-butterfly {
      width: 46px;
      height: 46px;
    }
  }
</style>
</head>
<body>

<!-- Chrome -->
<!-- <div class="hamburger"><span></span><span></span><span></span></div>
<div class="brand">LEADERBOARD</div> -->
<div class="scroll-indicator" id="scrollHint">SCROLL<span class="chev"></span></div>
<div id="pageVeil" aria-hidden="true"></div>
<!-- Fixed stage for scenes 1-4 -->
<div id="stage">
  <canvas id="particles"></canvas>

  <!-- Scene 1: first place (left-aligned text, hanging butterflies, rings) -->
  <div class="scene" id="scene1">
    <!-- Rings at the bottom (like the reference's planet rings) -->
    <div class="rings" id="rings1">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="ring r4"></div>
    </div>

    <!-- Hanging lines + side butterflies -->
    <div class="hang-line" id="line-s1-a" style="left: 28%;"></div>
    <div class="hang-line" id="line-s1-b" style="left: 72%;"></div>

    <div class="butterfly-side" id="bf-s1-a" style="left: 28%; top: 45%;">
      <!-- svg below injected -->
    </div>
    <div class="butterfly-side" id="bf-s1-b" style="left: 72%; top: 55%;"></div>

    <!-- Hero butterfly (1st place) center hanging -->
    <div class="hang-line" id="line-1" style="left: 50%;"></div>
    <div class="butterfly-hero" id="bf-1" data-color="#ffd76a"></div>

    <!-- Text -->
    <div class="slide-text" id="text-1">
      <div class="rank-label">1ST PLACE</div>
      <div class="name" data-placeholder>[PARTICIPANT NAME]</div>
      <div class="divider"></div>
      <div class="points">[0000] PTS</div>
    </div>
  </div>

  <!-- Scene 2: second place (centered text, one hero butterfly dropping) -->
  <div class="scene" id="scene2">
    <div class="hang-line" id="line-2" style="left: 50%;"></div>
    <div class="butterfly-hero" id="bf-2" data-color="#d0d6de"></div>

    <div class="slide-text" id="text-2">
      <div class="rank-label" style="text-align:center;">2ND PLACE</div>
      <div class="name" data-placeholder>[PARTICIPANT NAME]</div>
      <div class="divider" style="margin-left:auto;margin-right:auto;"></div>
      <div class="points">[0000] PTS</div>
    </div>
  </div>

  <!-- Scene 3: third place (right-aligned text, nebula) -->
  <div class="scene" id="scene3">
    <div class="nebula n1" id="neb1"></div>
    <div class="nebula n2" id="neb2"></div>

    <div class="hang-line" id="line-3" style="left: 35%;"></div>
    <div class="butterfly-hero" id="bf-3" data-color="#e39872" style="left:35%;"></div>

    <div class="slide-text" id="text-3">
      <div class="rank-label">3RD PLACE</div>
      <div class="name" data-placeholder>[PARTICIPANT NAME]</div>
      <div class="divider" style="margin-left:auto;"></div>
      <div class="points">[0000] PTS</div>
    </div>
  </div>

  <!-- Scene 4: blank design slide -->
  <div class="scene" id="scene4">
    <div class="blank-deco" id="blankDeco">
      <div class="crosshair"></div>
      <div class="crosshair v"></div>
      <div class="ring-dec a"></div>
      <div class="ring-dec b"></div>
      <div class="ring-dec c"></div>
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
    </div>
  </div>
</div>

<!-- Rankings section (normal flow, shows after stage) -->
<section id="rankings">
  <div class="rk-head">
    <h2>FULL RANKINGS</h2>
    <p>Click any butterfly to view details</p>
  </div>
  <div class="rk-field" id="rkField">
    <div class="rk-circle-container" id="rkCircle"></div>
    <div class="rk-search-bar" id="rkSearchBar">
      <input type="text" id="rkSearchInput" placeholder="Search by name...">
      <div class="rk-search-hint">Type butterfly code</div>
    </div>
  </div>
</section>

<!-- Tooltip -->
<div class="rk-tooltip" id="rkTooltip">
  <div class="tt-name">P00</div>
  <div class="tt-rank">RANK #00</div>
  <div class="tt-points">0000 PTS</div>
</div>

<script>
/* ============================================================
   BUTTERFLY SVG BUILDER (low-poly, same aesthetic)
   ============================================================ */
function butterflySVG(color, accent){
  accent = accent || '#ffffff';

  <svg viewBox="-60 -60 120 120" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g-${color.replace('#','')}" x1="0" x2="1" y1="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0.55"/>
      </linearGradient>

    <!-- Left wing (low-poly facets) -->

      <polygon points="-2,-8 -42,-40 -48,-10 -30,10 -5,5" fill="url(#g-${color.replace('#','')})" stroke="${accent}" stroke-width="0.6" stroke-opacity="0.6"/>
      <polygon points="-5,5 -30,10 -38,34 -12,28 -2,10" fill="${color}" fill-opacity="0.65" stroke="${accent}" stroke-width="0.5" stroke-opacity="0.5"/>

    <!-- Right wing mirror -->

      <polygon points="2,-8 42,-40 48,-10 30,10 5,5" fill="url(#g-${color.replace('#','')})" stroke="${accent}" stroke-width="0.6" stroke-opacity="0.6"/>
      <polygon points="5,5 30,10 38,34 12,28 2,10" fill="${color}" fill-opacity="0.65" stroke="${accent}" stroke-width="0.5" stroke-opacity="0.5"/>

/* ============================================================
   PARTICLES CANVAS (star-field with depth-based parallax)
   ============================================================ */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];
function sizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
function buildParticles(){
  particles = [];
  const count = Math.min(260, Math.floor((window.innerWidth*window.innerHeight)/6000));
  for (let i=0;i<count;i++){
    const depth = Math.random(); // 0 = far, 1 = close
    particles.push({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      r: 0.3 + depth*1.6,
      alpha: 0.2 + depth*0.8,
      depth,
      vx: (Math.random()-0.5)*0.05,
      vy: -0.02 - depth*0.05,
      shape: Math.random() > 0.85 ? 'sq' : 'dot'
    });
  }
}
sizeCanvas(); buildParticles();
window.addEventListener('resize', () => { sizeCanvas(); buildParticles(); });

/* ============================================================
   VIRTUAL SCROLL + SMOOTH PROGRESS (lerp)
   ============================================================ */
const STAGE_SCROLL = () => (window.innerWidth <= 700 ? window.innerHeight * 2.75 : window.innerHeight * 5.5); // shorten mobile stage so rankings starts sooner on phones
const VIRTUAL_TAIL_VH = 0.8; // extra virtual scroll after rankings start
let targetProgress = 0; // 0 to 1 (based on real scroll within stage range)
let currentProgress = 0;

function stageScrollLimit() {
  const rankingsTop = document.getElementById('rankings').offsetTop;
  const tail = window.innerHeight * VIRTUAL_TAIL_VH;
  return Math.max(1, Math.min(STAGE_SCROLL(), rankingsTop - tail));
}

function updateTargetProgress(){
  const s = window.scrollY;
  const max = stageScrollLimit();
  targetProgress = Math.min(1, Math.max(0, s / max));
}
window.addEventListener('scroll', updateTargetProgress, { passive:true });

/* ============================================================
   UTILITIES
   ============================================================ */
const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
const lerp  = (a,b,t) => a + (b-a)*t;
// Re-map a local progress within [a..b] to 0..1, clamped
const seg   = (p,a,b) => clamp((p-a)/(b-a), 0, 1);
// Ease in-out
const ease  = t => t<.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
const easeOut = t => 1 - Math.pow(1-t, 3);
const isMobileLeaderboard = () => window.matchMedia('(max-width: 700px)').matches;

/* ============================================================
   SCENE KEYFRAMES
   Progress ranges (of 0-1 virtual scroll):
     Scene 1 (1st place):   0.00 - 0.22
     Transition 1->2:       0.22 - 0.28
     Scene 2 (2nd place):   0.28 - 0.48
     Transition 2->3:       0.48 - 0.54
     Scene 3 (3rd place):   0.54 - 0.74
     Transition 3->4:       0.74 - 0.82
     Scene 4 (blank):       0.82 - 1.00
   ============================================================ */

// Cache elements
const $ = sel => document.querySelector(sel);
const bf1 = $('#bf-1'), bf2 = $('#bf-2'), bf3 = $('#bf-3');
const bfSa = $('#bf-s1-a'), bfSb = $('#bf-s1-b');
const lineS1a = $('#line-s1-a'), lineS1b = $('#line-s1-b');
const line1 = $('#line-1'), line2 = $('#line-2'), line3 = $('#line-3');
const text1 = $('#text-1'), text2 = $('#text-2'), text3 = $('#text-3');

const neb1 = $('#neb1'), neb2 = $('#neb2');

function applyScene(p){
  // Fade the stage out once we've passed the virtual scroll range — so the
  // Rankings section below becomes visible in normal scroll.
  // Use targetProgress (raw scroll) for immediate response, not the lerp'd value.
  if (window.scrollY >= stageScrollLimit() - 1) stageEl.classList.add('done');
  else stageEl.classList.remove('done');
  // ============ SCENE 1 (0.00 - 0.28) ============
  // Hero butterfly descends on its line from above.
  const s1Enter = seg(p, 0.00, 0.18);        // butterfly falls into place
  const s1Text  = seg(p, 0.05, 0.18);        // text fades in
  const s1Exit  = seg(p, 0.22, 0.30);        // scene 1 fades out upward

  // Descent: butterfly starts at -120vh, lands at 50% vh
  const dropY1 = lerp(-window.innerHeight*1.1, 0, easeOut(s1Enter));
  // On exit, drifts up & fades
  const exitY1 = -s1Exit * window.innerHeight * 0.6;
  bf1.style.transform = `translate(-50%, calc(-50% + ${dropY1 + exitY1}px)) scale(${lerp(0.85,1,s1Enter)})`;
  bf1.style.opacity   = (1 - s1Exit).toFixed(3);

  // Line scale Y (grows as butterfly falls)
  line1.style.transform = `scaleY(${easeOut(s1Enter)})`;
  line1.style.opacity   = (1 - s1Exit*0.8).toFixed(3);

  // Side butterflies
  const sa = seg(p, 0.02, 0.20);
  const sb = seg(p, 0.06, 0.24);
  bfSa.style.transform = `translate(-50%, calc(-50% + ${lerp(-window.innerHeight, 0, easeOut(sa))}px))`;
  bfSa.style.opacity   = (easeOut(sa) * (1 - s1Exit)).toFixed(3);
  bfSb.style.transform = `translate(-50%, calc(-50% + ${lerp(-window.innerHeight, 0, easeOut(sb))}px))`;
  bfSb.style.opacity   = (easeOut(sb) * (1 - s1Exit)).toFixed(3);
  lineS1a.style.transform = `scaleY(${easeOut(sa)})`;
  lineS1a.style.opacity   = (1 - s1Exit).toFixed(3);
  lineS1b.style.transform = `scaleY(${easeOut(sb)})`;
  lineS1b.style.opacity   = (1 - s1Exit).toFixed(3);

  // Text parallax (moves slightly up as user scrolls)
  const t1y = lerp(40, -80, seg(p, 0.00, 0.28));
  if (isMobileLeaderboard()) {
    text1.style.transform = `translate(-50%, ${t1y}px)`;
  } else {
    text1.style.transform = `translateY(${t1y}px)`;
  }
  text1.style.opacity   = (s1Text * (1 - s1Exit)).toFixed(3);

  // Rings (scene 1 bottom)
  const ringsP = seg(p, 0.04, 0.20);
  const ringsExit = seg(p, 0.22, 0.30);
  rings1.style.transform = `translate(-50%, calc(-50% + ${lerp(80, 0, easeOut(ringsP))}px)) rotateX(75deg)`;
  rings1.style.opacity   = (easeOut(ringsP) * (1 - ringsExit)).toFixed(3);

  // Scene 1 container parallax (subtle Y shift)
  scene1.style.transform = `translateY(${-p * window.innerHeight * 0.4}px)`;

  // ============ SCENE 2 (0.22 - 0.54) ============
  const s2Enter = seg(p, 0.28, 0.40);
  const s2Text  = seg(p, 0.32, 0.42);
  const s2Exit  = seg(p, 0.48, 0.56);

  const dropY2 = lerp(-window.innerHeight*1.1, 0, easeOut(s2Enter));
  const exitY2 = -s2Exit * window.innerHeight * 0.6;
  bf2.style.transform = `translate(-50%, calc(-50% + ${dropY2 + exitY2}px)) scale(${lerp(0.85,1.05,s2Enter)})`;
  bf2.style.opacity   = (easeOut(s2Enter) * (1 - s2Exit)).toFixed(3);
  line2.style.transform = `scaleY(${easeOut(s2Enter)})`;
  line2.style.opacity   = ((1 - s2Exit)*(easeOut(s2Enter))).toFixed(3);

  const t2y = lerp(60, -60, seg(p, 0.28, 0.54));
  text2.style.transform = `translate(-50%, calc(0px + ${t2y}px))`;
  text2.style.opacity   = (s2Text * (1 - s2Exit)).toFixed(3);

  // Scene 2 parallax
  scene2.style.transform = `translateY(${lerp(window.innerHeight*0.5, -window.innerHeight*0.3, seg(p,0.22,0.56))}px)`;
  scene2.style.opacity   = seg(p, 0.22, 0.30).toFixed(3);

  // ============ SCENE 3 (0.48 - 0.82) ============
  const s3Enter = seg(p, 0.54, 0.66);
  const s3Text  = seg(p, 0.58, 0.70);
  const s3Exit  = seg(p, 0.74, 0.84);

  const dropY3 = lerp(-window.innerHeight*1.1, 0, easeOut(s3Enter));
  const exitY3 = -s3Exit * window.innerHeight * 0.6;
  bf3.style.transform = `translate(-50%, calc(-50% + ${dropY3 + exitY3}px)) scale(${lerp(0.85,1,s3Enter)})`;
  bf3.style.opacity   = (easeOut(s3Enter) * (1 - s3Exit)).toFixed(3);
  line3.style.transform = `scaleY(${easeOut(s3Enter)})`;
  line3.style.opacity   = ((1 - s3Exit)*(easeOut(s3Enter))).toFixed(3);

  const t3y = lerp(50, -70, seg(p, 0.54, 0.82));
  if (isMobileLeaderboard()) {
    text3.style.transform = `translate(-50%, ${t3y}px)`;
  } else {
    text3.style.transform = `translateY(${t3y}px)`;
  }
  text3.style.opacity   = (s3Text * (1 - s3Exit)).toFixed(3);

  // Nebula reveal + drift
  const nebP = seg(p, 0.50, 0.72);
  const nebExit = seg(p, 0.74, 0.84);
  neb1.style.opacity = (easeOut(nebP) * (1 - nebExit)).toFixed(3);
  neb2.style.opacity = (easeOut(nebP) * 0.8 * (1 - nebExit)).toFixed(3);
  neb1.style.transform = `translate(${lerp(60, -40, nebP)}px, ${lerp(30, -30, nebP)}px) scale(${lerp(0.8,1.1,nebP)})`;
  neb2.style.transform = `translate(${lerp(-40, 80, nebP)}px, ${lerp(50, -20, nebP)}px) scale(${lerp(0.9,1.15,nebP)})`;

  // Scene 3 parallax
  scene3.style.transform = `translateY(${lerp(window.innerHeight*0.5, -window.innerHeight*0.3, seg(p,0.48,0.84))}px)`;
  scene3.style.opacity   = seg(p, 0.48, 0.56).toFixed(3);

  /* ============ SCENE 4 (0.74 - 1.0) ============
  const s4Enter = seg(p, 0.82, 0.95);
  blankDeco.style.opacity = easeOut(s4Enter).toFixed(3);
  scene4.style.transform = `translateY(${lerp(window.innerHeight*0.5, 0, seg(p,0.74,0.95))}px)`;
*/
  // ============ GLOBAL ============
  // Hide scroll hint after some scroll
  scrollHint.style.opacity = Math.max(0, 1 - p*4).toFixed(3);

  // Particles: draw with parallax based on progress
  drawParticles(currentProgress);

}

function drawParticles(p){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for (const pt of particles){
    // Parallax: further particles move less, closer ones more
    const offY = -p * window.innerHeight * 1.5 * pt.depth;
    const x = pt.x + pt.vx;
    let y = (pt.y + pt.vy + offY) % canvas.height;
    if (y < 0) y += canvas.height;
    pt.x = x; pt.y = (pt.y + pt.vy) % canvas.height;
    if (pt.x < 0) pt.x += canvas.width;
    if (pt.x > canvas.width) pt.x -= canvas.width;
    if (pt.y < 0) pt.y += canvas.height;

    ctx.globalAlpha = pt.alpha;
    ctx.fillStyle = '#ffffff';
    if (pt.shape === 'sq'){
      ctx.fillRect(x, y, pt.r*1.4, pt.r*1.4);
    } else {
      ctx.beginPath();
      ctx.arc(x, y, pt.r, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

/* ============================================================
   RAF LOOP WITH LERP SMOOTHING — creates silky scroll feel
   ============================================================ */
function loop(){
  currentProgress = lerp(currentProgress, targetProgress, 0.08);
  applyScene(currentProgress);
  requestAnimationFrame(loop);
}
updateTargetProgress();
requestAnimationFrame(loop);

  const pad = 14;

  const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
  if (x + tw > window.innerWidth - 8) x = e.clientX - tw - pad;

  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
}

/* ============================================================
   CIRCULAR LAYOUT + SPOTLIGHT SEARCH
   ============================================================ */
function layoutCircular(){
  const butterflies = document.querySelectorAll('.rk-butterfly');
  const container = document.getElementById('rkCircle');
  if (!container || butterflies.length === 0) return;

  if (isMobileLeaderboard()) {
    const containerWidth = container.clientWidth || window.innerWidth;
    const containerHeight = Math.max(container.clientHeight || 0, 680);
    const centerX = containerWidth * 0.5;
    const centerY = containerHeight * 0.54;
    const xRadius = Math.max(112, containerWidth * 0.42);
    const yRadius = Math.max(150, containerHeight * 0.34);
    const placements = [];
    const anchors = [
      { x: centerX - xRadius * 0.62, y: centerY - yRadius * 0.44 },
      { x: centerX + xRadius * 0.46, y: centerY - yRadius * 0.18 },
      { x: centerX - xRadius * 0.28, y: centerY + yRadius * 0.24 },
      { x: centerX + xRadius * 0.56, y: centerY + yRadius * 0.34 },
      { x: centerX, y: centerY }
    ];

    butterflies.forEach((b, idx) => {
      const size = 40 + ((idx * 9) % 12) + (idx % 3 === 0 ? 4 : 0);
      let x = centerX;
      let y = centerY;
      let placed = false;
      const anchor = anchors[idx % anchors.length];

      for (let attempt = 0; attempt < 80 && !placed; attempt += 1) {
        const angle = Math.random() * Math.PI * 2;
        const radiusScale = 0.24 + Math.random() * 0.86;
        const spiral = attempt % 2 === 0 ? 1 : -1;
        const localXRadius = xRadius * (0.58 + Math.random() * 0.82);
        const localYRadius = yRadius * (0.56 + Math.random() * 0.88);
        x = anchor.x + Math.cos(angle + spiral * 0.14) * localXRadius * radiusScale + (Math.random() - 0.5) * 34;
        y = anchor.y + Math.sin(angle - spiral * 0.08) * localYRadius * radiusScale + (Math.random() - 0.5) * 30;

        x = Math.max(10, Math.min(containerWidth - size - 10, x));
        y = Math.max(76, Math.min(containerHeight - size - 12, y));

        placed = true;
        for (const pos of placements) {
          const dx = x - pos.x;
          const dy = y - pos.y;
          const minDistance = (size + pos.size) * 0.68;
          if (Math.sqrt(dx * dx + dy * dy) < minDistance) {
            placed = false;
            break;
          }
        }
      }

      if (!placed) {
        const fallbackAngle = (idx / butterflies.length) * Math.PI * 2;
        x = anchor.x + Math.cos(fallbackAngle) * (xRadius * 0.48) + ((idx % 3) - 1) * 24;
        y = anchor.y + Math.sin(fallbackAngle) * (yRadius * 0.48) + ((idx % 4) - 1.5) * 18;
        x = Math.max(10, Math.min(containerWidth - size - 10, x));
        y = Math.max(76, Math.min(containerHeight - size - 12, y));
      }

      placements.push({ x, y, size });
      b.style.width = size + 'px';
      b.style.height = size + 'px';
      b.style.left = (x - size / 2) + 'px';
      b.style.top = (y - size / 2) + 'px';
      b.style.animationDelay = (Math.random() * 4).toFixed(2) + 's';
      b.style.animationDuration = (5 + Math.random() * 3).toFixed(2) + 's';
    });

    return;
  }
  
  const containerSize = container.offsetWidth;
  if (containerSize === 0) {
    setTimeout(layoutCircular, 50);
    return;
  }
  
  const centerX = containerSize / 2;
  const centerY = containerSize / 2;
  const minRadius = (containerSize / 2) * 0.30; // Inner hole
  const maxRadius = (containerSize / 2) * 0.85; // Outer boundary
  
  // Generate random positions for all butterflies
  const positions = [];
  
  butterflies.forEach((b, idx) => {
    let attempts = 0;
    let validPosition = false;
    let x, y;
    
    // Try to find a valid random position with no overlap
    while (!validPosition && attempts < 50) {
      const angle = Math.random() * 2 * Math.PI;
      const radius = minRadius + Math.random() * (maxRadius - minRadius);
      
      x = centerX + radius * Math.cos(angle);
      y = centerY + radius * Math.sin(angle);
      
      const size = parseInt(b.style.width);
      const minDistance = size + 10; // Butterfly size + gap
      
      // Check for overlap with already positioned butterflies
      validPosition = true;
      for (let pos of positions) {
        const dx = x - pos.x;
        const dy = y - pos.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        if (distance < minDistance) {
          validPosition = false;
          break;
        }
      }
      
      attempts++;
    }
    
    const size = parseInt(b.style.width);
    positions.push({ x, y });
    b.style.left = (x - size/2) + 'px';
    b.style.top = (y - size/2) + 'px';
  });
}

window.addEventListener('load', layoutCircular);
window.addEventListener('resize', layoutCircular);

if (rkSearchInput) {
  rkSearchInput.addEventListener('input', (e) => {
    const query = e.target.value.toUpperCase().trim();
    const butterflies = document.querySelectorAll('.rk-butterfly');
    
    if (query.length === 0) {
      // Clear search: show all normally
      butterflies.forEach(b => {
        b.classList.remove('dimmed', 'highlighted');
      });
    } else {
      // Apply spotlight effect
      butterflies.forEach(b => {
        const name = b.dataset.name.toUpperCase();
        if (name.includes(query)) {
          b.classList.remove('dimmed');
          b.classList.add('highlighted');
        } else {
          b.classList.remove('highlighted');
          b.classList.add('dimmed');
        }
      });
    }
  });
}

/* ============================================================
   INTRO VEIL
   ============================================================ */
window.addEventListener('load', () => {
  requestAnimationFrame(() => {
    const veil = document.getElementById('pageVeil');
    if (!veil) return;
    veil.classList.add('hidden');
    window.setTimeout(() => veil.remove(), 1400);
  });
});

/* Keyboard / Arrow / Spacebar nudge like the reference */
window.addEventListener('keydown', (e) => {
  const step = window.innerHeight * 0.9;
  if (e.code === 'ArrowDown' || e.code === 'Space' || e.code === 'PageDown'){
    window.scrollBy({ top: step, behavior: 'smooth' });
    e.preventDefault();
  } else if (e.code === 'ArrowUp' || e.code === 'PageUp'){
    window.scrollBy({ top: -step, behavior: 'smooth' });
    e.preventDefault();
  }
});
</script>
