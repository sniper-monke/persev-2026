<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Event Locations and Schedule - Perseverantia 2025">
    <link rel="icon" type="image/png" href="/assets/landing.png" />
    <title>Event Locations - Perseverantia</title>
    <link rel="preload" href="/static/style.min.css" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/static/style.min.css"></noscript>
    <link rel="stylesheet" href="/static/cursor-fx.css?v=20260407c">
    <script defer src="/static/cursor-fx.js?v=20260407c"></script>
    <link rel="stylesheet" href="/static/mobile-optimized.css?v=20260505" />
    <link rel="stylesheet" href="/static/persev-navbar.css?v=20260505a">
    <link rel="stylesheet" href="/static/persev-mobile-premium.css?v=20260505" />
    <script defer src="/static/persev-navbar.js?v=20260505"></script>
    <script src="https://cdn.jsdelivr.net/npm/animejs@4.0.0/lib/anime.iife.min.js"></script>
    <script src="/static/anime-animations.js?v=20260424a"></script>
    <script defer src="/static/cloud-transitions.js?v=20260430k"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      @font-face {
        font-family: Mestizo;
        src: url(/assets/MestizoFont.ttf);
        font-display: swap;
      }
      
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0a0f2c;
      }

      .locations-stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: 
          radial-gradient(ellipse at 20% 50%, rgba(248, 180, 45, 0.15) 0%, transparent 50%),
          radial-gradient(ellipse at 80% 50%, rgba(67, 233, 255, 0.12) 0%, transparent 50%),
          linear-gradient(135deg, #0D122C 0%, #131D3F 50%, #0a0f2c 100%);
      }

      /* Floating geometric shapes */
      .geo-shape {
        position: absolute;
        pointer-events: none;
        opacity: 0;
      }

      .geo-ring {
        border: 2px solid rgba(190, 142, 48, 0.3);
        border-radius: 50%;
      }

      .geo-dot {
        background: rgba(190, 142, 48, 0.6);
        border-radius: 50%;
        filter: blur(2px);
      }

      .geo-hex {
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        background: rgba(67, 233, 255, 0.15);
      }

      /* Coming Soon text */
      .coming-soon-container {
        position: relative;
        z-index: 10;
        text-align: center;
        perspective: 800px;
      }

      .coming-soon-text {
        font-family: Mestizo, sans-serif;
        font-size: clamp(3rem, 10vw, 7rem);
        font-weight: 700;
        color: transparent;
        background: linear-gradient(135deg, #BE8E30 0%, #FFD700 50%, #F8B42D 100%);
        -webkit-background-clip: text;
        background-clip: text;
        letter-spacing: 0.1em;
        text-shadow: 0 0 40px rgba(190, 142, 48, 0.4);
        position: relative;
        display: inline-block;
      }

      .coming-soon-text span {
        display: inline-block;
        opacity: 0;
      }

      .coming-soon-sub {
        font-family: Mestizo, sans-serif;
        font-size: clamp(0.9rem, 2vw, 1.4rem);
        color: rgba(183, 191, 219, 0.8);
        letter-spacing: 0.35em;
        text-transform: uppercase;
        margin-top: 1.5rem;
        opacity: 0;
      }

      .coming-soon-line {
        width: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, #BE8E30, transparent);
        margin: 1.5rem auto;
        opacity: 0;
      }

      /* Floating particles */
      .particle {
        position: absolute;
        width: 4px;
        height: 4px;
        background: rgba(190, 142, 48, 0.5);
        border-radius: 50%;
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .geo-shape, .particle {
          animation: none !important;
          opacity: 0.3 !important;
        }
        .coming-soon-text span,
        .coming-soon-sub,
        .coming-soon-line {
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
    <!-- Flash prevention: hide body and show placeholder immediately if coming from transition -->
    <script>(function(){try{if(sessionStorage.getItem('persev_transition_state')){document.documentElement.style.background='#050914';document.write('<style>body{visibility:hidden;background:#050914}</style><div id="cloud-placeholder" style="position:fixed;inset:0;z-index:2147483647;background:linear-gradient(135deg,#1a3a6b 0%,#3a7abf 50%,#89b9e0 100%);opacity:0.9;transition:opacity 0.3s"><div style="position:absolute;left:0;top:0;bottom:0;width:60%;background:linear-gradient(90deg,#4a6fa5 0%,#6b8cae 100%);transform:translateX(-10%) rotate(-2deg);filter:blur(20px)"></div><div style="position:absolute;right:0;top:0;bottom:0;width:60%;background:linear-gradient(270deg,#4a6fa5 0%,#6b8cae 100%);transform:angle(10%) rotate(2deg);filter:blur(20px)"></div></div>');}}catch(e){}})();</script>
  </head>
  <body>
    <div class="locations-stage" id="locationsStage">
      <!-- Geometric shapes -->
      <div class="geo-shape geo-ring" style="width: 300px; height: 300px; top: 10%; left: 10%;"></div>
      <div class="geo-shape geo-ring" style="width: 200px; height: 200px; bottom: 15%; right: 15%;"></div>
      <div class="geo-shape geo-dot" style="width: 8px; height: 8px; top: 25%; right: 30%;"></div>
      <div class="geo-shape geo-dot" style="width: 6px; height: 6px; bottom: 30%; left: 25%;"></div>
      <div class="geo-shape geo-dot" style="width: 10px; height: 10px; top: 60%; left: 15%;"></div>
      <div class="geo-shape geo-hex" style="width: 80px; height: 80px; top: 20%; right: 20%;"></div>
      <div class="geo-shape geo-hex" style="width: 60px; height: 60px; bottom: 25%; left: 20%;"></div>

      <!-- Floating particles container -->
      <div id="particlesContainer"></div>

      <div class="coming-soon-container">
        <div class="coming-soon-text" id="comingSoonText">Coming Soon</div>
        <div class="coming-soon-line" id="comingSoonLine"></div>
        <div class="coming-soon-sub" id="comingSoonSub">Stay Tuned</div>
      </div>
    </div>

    <script>
      (function () {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        if (!window.anime || typeof window.anime !== 'function') return;
        const anime = window.anime;

        /* Animate geometric shapes into view */
        anime({
          targets: '.geo-shape',
          opacity: [0, 0.3],
          scale: [0.5, 1],
          duration: 1200,
          easing: 'out(3)',
          delay: anime.stagger(100)
        });

        /* Continuous floating for shapes */
        anime({
          targets: '.geo-ring',
          translateX: function () { return anime.random(-20, 20); },
          translateY: function () { return anime.random(-20, 20); },
          rotate: function () { return anime.random(-10, 10); },
          scale: function () { return anime.random(0.9, 1.1); },
          duration: anime.random(6000, 12000),
          easing: 'easeInOutSine',
          direction: 'alternate',
          loop: true,
          delay: anime.stagger(300)
        });

        anime({
          targets: '.geo-hex',
          rotate: [0, 360],
          duration: anime.random(20000, 30000),
          easing: 'linear',
          loop: true
        });

        anime({
          targets: '.geo-dot',
          translateY: [-10, 10],
          opacity: [0.3, 0.7],
          duration: anime.random(2000, 4000),
          easing: 'easeInOutSine',
          direction: 'alternate',
          loop: true,
          delay: anime.stagger(400)
        });

        /* Floating particles */
        const container = document.getElementById('particlesContainer');
        for (let i = 0; i < 20; i++) {
          const p = document.createElement('div');
          p.className = 'particle';
          p.style.left = Math.random() * 100 + 'vw';
          p.style.top = Math.random() * 100 + 'vh';
          p.style.opacity = Math.random() * 0.5 + 0.2;
          p.style.width = (Math.random() * 3 + 2) + 'px';
          p.style.height = p.style.width;
          p.style.background = Math.random() > 0.5 ? 'rgba(190, 142, 48, 0.5)' : 'rgba(67, 233, 255, 0.4)';
          container.appendChild(p);

          anime({
            targets: p,
            translateY: [0, -100],
            opacity: [p.style.opacity, 0],
            duration: anime.random(4000, 8000),
            easing: 'easeOutQuad',
            loop: true,
            delay: anime.random(0, 4000)
          });
        }

        /* Character stagger for "Coming Soon" */
        const textEl = document.getElementById('comingSoonText');
        if (textEl) {
          const text = textEl.textContent;
          textEl.innerHTML = '';
          text.split('').forEach(function (ch) {
            const span = document.createElement('span');
            span.textContent = ch === ' ' ? '\u00A0' : ch;
            textEl.appendChild(span);
          });

          anime({
            targets: textEl.querySelectorAll('span'),
            translateY: [40, 0],
            opacity: [0, 1],
            rotateX: [60, 0],
            duration: 750,
            easing: 'out(3)',
            delay: anime.stagger(45, { start: 300 })
          });

          /* Subtle letter-spacing breathe */
          anime({
            targets: textEl,
            letterSpacing: ['0.08em', '0.14em'],
            duration: 3500,
            easing: 'easeInOutSine',
            direction: 'alternate',
            loop: true,
            delay: 1200
          });
        }

        /* Divider line draw-on */
        anime({
          targets: '#comingSoonLine',
          width: ['0%', '60%'],
          opacity: [0, 1],
          duration: 800,
          easing: 'out(4)',
          delay: 900
        });

        /* Subtitle fade in */
        anime({
          targets: '#comingSoonSub',
          translateY: [16, 0],
          opacity: [0, 1],
          duration: 600,
          easing: 'out(3)',
          delay: 1100
        });

        /* Background gradient subtle pulse */
        const stage = document.getElementById('locationsStage');
        if (stage) {
          anime({
            targets: stage,
            backgroundPosition: ['0% 50%', '100% 50%'],
            duration: 12000,
            easing: 'easeInOutSine',
            direction: 'alternate',
            loop: true
          });
        }
      })();
    </script>
  </body>
</html>
