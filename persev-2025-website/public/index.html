          transform: none !important;

          transition: none !important;

        }

      }

    </style>

  </head>

  <body>

    <div id="vanta-clouds" aria-hidden="true"></div>

    <div id="root"></div>



    <nav class="toormix-nav" id="persevNav" aria-label="Primary">

      <div class="toormix-nav__inner">

        <div class="toormix-nav__menu">

          <div class="toormix-nav__cluster toormix-nav__cluster--left">

            <a class="toormix-nav__link" href="/">Home</a>

            <a class="toormix-nav__link " href="/events">Events</a>

            <a class="toormix-nav__link" href="/links">Links</a>

          </div>

          <button class="toormix-nav__logo toormix-menu-open-btn" id="persevMenuOpen" type="button" aria-expanded="false" aria-controls="persevMenuOverlay" aria-label="Open menu">

            <img src="/assets/landing.png" alt="Perseverantia" />

          </button>

          <div class="toormix-nav__cluster toormix-nav__cluster--right">

            <a class="toormix-nav__link" href="/leaderboard">Leaderboard</a>

            <a class="toormix-nav__link" href="/organizing-committee">Organizing Committee</a>

          </div>

        </div>


      </div>



      <div class="toormix-nav__switch" aria-hidden="true">

        <button class="toormix-nav__switch-logo toormix-menu-open-btn" id="persevMenuOpen" type="button" aria-expanded="false" aria-controls="persevMenuOverlay" aria-label="Open menu">

          <img src="/assets/landing.png" alt="Perseverantia" />

        </button>

      </div>

    </nav>



    <div class="toormix-overlay" id="persevMenuOverlay" aria-hidden="true">

      <div class="toormix-overlay__backdrop"></div>

      <div class="toormix-overlay__rings">

        <div class="toormix-ring toormix-ring--1"></div>

        <div class="toormix-ring toormix-ring--2"></div>

        <div class="toormix-ring toormix-ring--3"></div>

        <div class="toormix-ring toormix-ring--4"></div>

        <div class="toormix-ring toormix-ring--5"></div>

      </div>

      <nav aria-label="Expanded site menu">

        <ul class="toormix-overlay__menu">

          <li><a class="toormix-overlay__item toormix-overlay__item--1" href="/leaderboard">LEADERBOARD</a></li>

          <li><a class="toormix-overlay__item toormix-overlay__item--2" href="/events">EVENTS</a></li>

          <li><a class="toormix-overlay__item toormix-overlay__item--3" href="/organizing-committee">ORGANIZING COMMITTEE</a></li>

          <li><a class="toormix-overlay__item toormix-overlay__item--4" href="/links">LINKS</a></li>

          <li><a class="toormix-overlay__item toormix-overlay__item--5" href="/">HOME</a></li>

        </ul>

      </nav>

      <button class="toormix-overlay__close" id="persevMenuClose" type="button" aria-label="Close menu"></button>

    </div>



    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.clouds.min.js"></script>

    

    <!-- GSAP for page transitions -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script defer src="/static/gsap-transitions.js?v=20260430a"></script>


    <script>

      (function () {

        let vantaClouds = null;

        let visibilityFallbackTimer = null;



        const removeLegacyTopUi = function () {

          const selectors = [

            '#root .gallery-ui > header.header',

            '#root .gallery-ui > .header',

            '#root .gallery-ui .header',

            '#root .gallery-ui .logo',

            '#root .gallery-ui .about-link',

            '#root [class*="topbar"]',

            '#root [class*="top-bar"]',

            '#root [class*="navbar"]'

          ];



          selectors.forEach((selector) => {

            document.querySelectorAll(selector).forEach((node) => {

              if (node && node.parentNode) {

                node.parentNode.removeChild(node);

              }

            });

          });

        };



        const destroyVanta = function () {

          if (vantaClouds && typeof vantaClouds.destroy === "function") {

            vantaClouds.destroy();

            vantaClouds = null;

          }

        };



        const initVanta = function () {

          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {

            return;

          }



          const target = document.getElementById("vanta-clouds");

          if (!target || !window.VANTA || !window.VANTA.CLOUDS) {

            return;

          }



          destroyVanta();

          vantaClouds = window.VANTA.CLOUDS({

            el: target,

            mouseControls: true,

            touchControls: true,

            gyroControls: false,

            minHeight: 200,

            minWidth: 200,

            speed: 1.1,

            skyColor: 0x0b1a44,

            cloudColor: 0x365a8b,

            cloudShadowColor: 0x09122f,

            sunColor: 0xf8b42d,

            sunGlareColor: 0xffd875,

            sunlightColor: 0xffc44d

          });

        };



        const revealHomeShell = function () {

          const vantaContainer = document.getElementById("vanta-clouds");

          const rootNode = document.getElementById("root");

          const navNode = document.getElementById("persevNav");



          if (vantaContainer) {

            vantaContainer.style.opacity = "1";

            vantaContainer.style.visibility = "visible";

          }



          if (rootNode) {

            rootNode.style.opacity = "1";

            rootNode.style.visibility = "visible";

          }



          if (navNode) {

            navNode.style.opacity = "1";

            navNode.style.visibility = "visible";

          }

        };



        document.addEventListener("DOMContentLoaded", initVanta, { once: true });

        window.addEventListener("load", initVanta, { once: true });

        window.addEventListener("pagehide", destroyVanta);

        window.addEventListener("load", removeLegacyTopUi);

        window.addEventListener("pageshow", revealHomeShell);



        const root = document.getElementById('root');

        if (root && typeof MutationObserver !== 'undefined') {

          const topUiObserver = new MutationObserver(() => {

            removeLegacyTopUi();

          });

          topUiObserver.observe(root, { childList: true, subtree: true });

        }

        

        // Keep the sky up immediately, then let the blob reveal independently.

        window.addEventListener("load", () => {

          setTimeout(() => {

            const vantaContainer = document.getElementById("vanta-clouds");

            if (vantaContainer) {

              vantaContainer.style.opacity = "1";

              vantaContainer.style.visibility = "visible";

            }

            const navNode = document.getElementById("persevNav");

            if (navNode) {

              navNode.style.opacity = "1";

              navNode.style.visibility = "visible";

            }

            removeLegacyTopUi();

          }, 60);

        });

      })();



      (function () {

        const nav = document.getElementById("persevNav");

        const menuOverlay = document.getElementById("persevMenuOverlay");

        const openBtns = document.querySelectorAll(".toormix-menu-open-btn");

        const closeBtn = document.getElementById("persevMenuClose");

        const menuLinks = menuOverlay ? menuOverlay.querySelectorAll(".toormix-overlay__item") : [];



        if (!nav || !menuOverlay || !openBtns.length || !closeBtn) {

          return;

        }



        let switched = false;

        let menuOpen = false;



        const setSwitched = (next) => {

          if (next === switched) {

            return;

          }

          switched = next;

          nav.classList.toggle("is-switched", switched);

          openBtns.forEach(function (btn) {

            btn.setAttribute("aria-expanded", "false");

          });

        };



        const setMenuOpen = (next) => {

          if (next === menuOpen) {

            return;

          }

          menuOpen = next;

          menuOverlay.classList.toggle("is-open", menuOpen);

          menuOverlay.setAttribute("aria-hidden", menuOpen ? "false" : "true");

          openBtns.forEach(function (btn) {

            btn.setAttribute("aria-expanded", menuOpen ? "true" : "false");

          });

        };



        openBtns.forEach(function (btn) {

          btn.addEventListener("click", function () {

            setMenuOpen(true);

          });

        });



        closeBtn.addEventListener("click", function () {

          setMenuOpen(false);

        });



        menuLinks.forEach(function (link) {

          link.addEventListener("click", function () {

            setMenuOpen(false);

          });

        });



        document.addEventListener("keydown", function (e) {

          if (e.key === "Escape") {

            setMenuOpen(false);

          }

        });



        const syncFromScroll = function () {

          setSwitched(window.scrollY > 24);

        };



        window.addEventListener("scroll", syncFromScroll, { passive: true });

        syncFromScroll();

      })();



      (function () {

        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {

          return;

        }



        if (!window.matchMedia("(pointer:fine)").matches) {

          return;

        }



        const root = document.documentElement;

        let targetX = 0;

        let targetY = 0;

        let currentX = 0;

        let currentY = 0;

        let frame = null;



        const clamp = function (v, min, max) {

          return Math.min(max, Math.max(min, v));

        };



        const tick = function () {

          currentX += (targetX - currentX) * 0.12;

          currentY += (targetY - currentY) * 0.12;



          root.style.setProperty("--txt-px", currentX.toFixed(4));

          root.style.setProperty("--txt-py", currentY.toFixed(4));



          if (Math.abs(targetX - currentX) > 0.001 || Math.abs(targetY - currentY) > 0.001) {

            frame = window.requestAnimationFrame(tick);

          } else {

            frame = null;

          }

        };



        const updateTarget = function (x, y) {

          targetX = clamp(x, -1.45, 1.45);

          targetY = clamp(y, -1.45, 1.45);



          if (!frame) {

            frame = window.requestAnimationFrame(tick);

          }

        };



        window.addEventListener(

          "pointermove",

          function (e) {

            const nx = (e.clientX / window.innerWidth - 0.5) * 2;

            const ny = (e.clientY / window.innerHeight - 0.5) * 2;

            updateTarget(nx, ny);

          },

          { passive: true }

        );



        window.addEventListener(

          "pointerleave",

          function () {

            updateTarget(0, 0);

          },

          { passive: true }

        );



        window.addEventListener(

          "blur",

          function () {

            updateTarget(0, 0);

          },

          { passive: true }

        );

      })();

    </script>

  </body>

</html>
