<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    background: radial-gradient(ellipse at top, #08101f 0%, #030712 45%, #000814 100%);
    color:#fff;
    font-family:'Rajdhani', sans-serif;
    overflow:hidden;
    letter-spacing:0.05em;
    width: 100%;
    height: 100vh;
  }

  #stage {
    position: fixed;
    inset: 0;
    width:100vw; height:100vh;
    overflow:hidden;
    z-index: 1;
  }

  #particles {
    position:fixed; inset:0;
    width:100%; height:100%;
    z-index: 1;
  }

  .scene {
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index: 2;
  }

  .rings {
    position:absolute;
    left: 50%; top: 75%;
    transform: translate(-50%, -50%);
    width: 1100px; height: 400px;
    opacity: 1;
  }
  .rings .ring {
    position:absolute;
    left:50%; top:50%;
    transform: translate(-50%,-50%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 50%;
  }
  .rings .ring.r1 { width: 300px; height: 70px; }
  .rings .ring.r2 { width: 520px; height: 130px; border-color: rgba(255,255,255,0.05); }
  .rings .ring.r3 { width: 780px; height: 210px; border-color: rgba(255,255,255,0.03); }
  .rings .ring.r4 { width: 1080px; height: 310px; border-color: rgba(255,255,255,0.02); }

  .slide-text {
    position:absolute;
    opacity: 1;
    font-family:'Rajdhani', sans-serif;
    font-weight:300;
    letter-spacing:0.35em;
    text-transform:uppercase;
  }
  .slide-text .rank-label {
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    margin-bottom: 18px;
    letter-spacing: 0.5em;
  }
  .slide-text .name {
    font-size: 44px;
    font-weight: 400;
    color: rgba(255,255,255,0.75);
    margin-bottom: 14px;
    letter-spacing: 0.18em;
  }
  .slide-text .divider {
    width: 60px; height: 1px;
    background: rgba(255,255,255,0.15);
    margin: 20px 0;
  }

  #text-1 { left: 8%;  top: 42%; }

  #stage.fade-out {
    animation: fadeOutStage 0.8s ease-out forwards;
  }

  @keyframes fadeOutStage {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Main content (eagle + loading bar) */
  .container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transition: opacity 0.6s ease;
    z-index: 2;
    pointer-events: none;
  }

  .container.visible {
    opacity: 1;
  }

  .logo {
    width: 300px;
    height: 300px;
    background-image: url('/assets/landing.png');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    animation: logoPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    opacity: 0;
  }

  @keyframes logoPop {
    0% {
      transform: scale(0);
      opacity: 0;
    }
    100% {
      transform: scale(1);
      opacity: 1;
    }
  }

  .loading-bar-container {
    position: absolute;
    bottom: 80px;
    width: 200px;
    height: 2px;
    background-color: rgba(255, 255, 255, 0.12);
    border-radius: 2px;
    overflow: hidden;
    opacity: 0;
    animation: appear 0s ease-in-out 1.2s forwards;
  }

  .loading-bar {
    height: 100%;
    background-color: rgba(255, 255, 255, 0.5);
    border-radius: 2px;
    width: 0%;
  }

  @keyframes appear {
    to {
      opacity: 1;
    }
  }

  .container.fade-out {
    animation: fadeOut 0.8s ease-in-out forwards;
  }

  @keyframes fadeOut {
    0% {
      opacity: 1;
    }
    100% {
      opacity: 0;
    }
  }

  @media (max-width: 700px) {
    #text-1 { left: 50%; transform: translateX(-50%); text-align:center; }
    .slide-text .name { font-size: 28px; }
  }
</style>

<body class="persev-landing">

<canvas id="particles"></canvas>

<div id="stage">
  <div class="scene" id="scene1">
    <div class="rings" id="rings1">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="ring r4"></div>
    </div>

    <div class="slide-text" id="text-1">
      <div class="rank-label">WELCOME TO</div>
      <div class="name">PERSEVERANTIA</div>
      <div class="divider"></div>
      <div class="rank-label" style="margin-top: 20px;">CLICK TO ENTER</div>
    </div>
  </div>
</div>

<!-- Main landing content (hidden initially) -->
<div class="container" id="mainContainer">
  <div class="logo"></div>
  <div class="loading-bar-container">
    <div class="loading-bar"></div>
  </div>
</div>

<audio id="bootAudio" preload="auto" playsinline>
  <source src="/assets/landing-tune.mp3" type="audio/mpeg">
</audio>

<script>
/* ============================================================
   PARTICLES CANVAS
   ============================================================ */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];
function sizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
function buildParticles(){
  particles = [];
  const count = Math.min(200, Math.floor((window.innerWidth*window.innerHeight)/7500));
  for (let i=0;i<count;i++){
    const depth = Math.random();
    particles.push({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      r: 0.25 + depth*1.2,
      alpha: 0.12 + depth*0.4,
      depth,
      vx: (Math.random()-0.5)*0.03,
      vy: -0.015 - depth*0.03,
      shape: Math.random() > 0.85 ? 'sq' : 'dot'
    });
  }
}
sizeCanvas(); buildParticles();
window.addEventListener('resize', () => { sizeCanvas(); buildParticles(); });

function drawParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for (const pt of particles){
    pt.x += pt.vx;
    pt.y += pt.vy;
    if (pt.x < 0) pt.x += canvas.width;
    if (pt.x > canvas.width) pt.x -= canvas.width;
    if (pt.y < 0) pt.y += canvas.height;
    if (pt.y > canvas.height) pt.y -= canvas.height;

    ctx.globalAlpha = pt.alpha;
    ctx.fillStyle = '#ffffff';
    if (pt.shape === 'sq'){
      ctx.fillRect(pt.x, pt.y, pt.r*1.4, pt.r*1.4);
    } else {
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

/* ============================================================
   ANIMATION LOOP
   ============================================================ */
const text1 = document.getElementById('text-1');
const rings1 = document.getElementById('rings1');
const stage = document.getElementById('stage');
const mainContainer = document.getElementById('mainContainer');
const audioElement = document.getElementById('bootAudio');
const loadingBar = document.querySelector('.loading-bar');

const lerp = (a,b,t) => a + (b-a)*t;
const easeOut = t => 1 - Math.pow(1-t, 3);

let animationProgress = 0;
let engaged = false;
let audioStartTime = 0;

function animate(){
  if (!engaged) {
    animationProgress = Math.min(1, animationProgress + 0.004);
  } else {
    animationProgress = Math.min(1, animationProgress + 0.012);
  }

  // Rings animation - subtle
  const ringsP = Math.min(animationProgress * 0.7, 1);
  rings1.style.transform = `translate(-50%, calc(-50% + ${lerp(60, 0, easeOut(ringsP))}px)) rotateX(75deg)`;

  if (engaged) {
    rings1.style.opacity = Math.max(0, 1 - (animationProgress - 0.4) * 3).toFixed(3);
  }

  // Text animation - subtle fade
  text1.style.opacity = (easeOut(Math.min(animationProgress, 0.35)) * (engaged ? Math.max(0, 1 - (animationProgress - 0.4) * 3) : 1)).toFixed(3);


  drawParticles();

  // When engagement animation finishes, transition to main screen
  if (engaged && animationProgress >= 0.7) {
    stage.classList.add('fade-out');
    mainContainer.classList.add('visible');
    return;
  }

  requestAnimationFrame(animate);
}
animate();

/* ============================================================
   ENGAGEMENT (CLICK / KEYBOARD) - MacBook intro style
   ============================================================ */
function engage(){
  if (engaged) return;
  engaged = true;

  // Step 1: Immediately show eagle logo + loading bar (MacBook intro style)
  stage.classList.add('fade-out');
  mainContainer.classList.add('visible');
  
  // Logo pops in immediately via CSS animation
  const logo = mainContainer.querySelector('.logo');
  if (logo) {
    logo.style.animation = 'logoPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';
  }

  // Loading bar fills as audio plays
  audioElement.currentTime = 0;
  audioElement.play().catch(e => console.error('Audio play failed:', e.name));
  audioStartTime = Date.now();

  // Update loading bar as audio plays
  const updateLoadingBar = () => {
    if (audioElement.duration > 0) {
      const progress = (audioElement.currentTime / audioElement.duration) * 100;
      loadingBar.style.width = progress + '%';
    }
    if (!audioElement.ended && !audioElement.paused) {
      requestAnimationFrame(updateLoadingBar);
    }
  };
  updateLoadingBar();

  // Wait for audio to end, then trigger cloud transition
  const checkAudioEnd = setInterval(() => {
    if (audioElement.paused || audioElement.ended) {
      clearInterval(checkAudioEnd);
      
      // Fade out the eagle/loading screen
      mainContainer.classList.add('fade-out');
      sessionStorage.setItem('landingPageSeen', 'true');

      // Wait for fade out, then navigate with cloud transition
      setTimeout(function() {
        if (window.PersevTransitions && typeof window.PersevTransitions.playExitTransition === 'function') {
          window.PersevTransitions.playExitTransition('/index.html');
        } else {
          window.location.href = '/index.html';
        }
      }, 800);
    }
  }, 100);
}

document.addEventListener('click', engage);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    engage();
    e.preventDefault();
  }
});

// Preload index page
function preloadIndexPage() {
  const link = document.createElement('link');
  link.rel = 'modulepreload';
  link.href = '/assets/index-GnKc23iY.js?v=20260416e';
  document.head.appendChild(link);

  fetch('/index.html', { method: 'GET' });

  const fontLink = document.createElement('link');
  fontLink.rel = 'preload';
  fontLink.as = 'font';
  fontLink.href = '/assets/MestizoFont.woff2';
  fontLink.type = 'font/woff2';
  fontLink.crossOrigin = 'anonymous';
  document.head.appendChild(fontLink);

  // Preload and cache blob data
  Promise.all([
    fetch('/assets/blob-data.json').then(r => r.json()).then(data => sessionStorage.setItem('blob-data-json', JSON.stringify(data))).catch(() => {}),
    fetch('/api/blob-data').then(r => r.json()).then(data => sessionStorage.setItem('blob-data-api', JSON.stringify(data))).catch(() => {})
  ]);

  const assets = ['/envmap.jpg', '/assets/MestizoFont.woff'];
  assets.forEach(asset => fetch(asset).catch(() => {}));
}

document.addEventListener('DOMContentLoaded', preloadIndexPage);
</script>
